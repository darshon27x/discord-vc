<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DARSHON Selfbot Panel</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <div id="authOverlay" class="auth-overlay">
        <div class="auth-card">
            <div class="auth-brand">
                <span class="brand-icon">🔑</span>
                <h2>Login to Panel</h2>
            </div>
            <p class="auth-subtitle">Please enter your details to continue</p>
            <div class="auth-inputs">
                <div class="input-container">
                    <label for="usernameInput">Username</label>
                    <input type="text" id="usernameInput" placeholder="Enter username">
                </div>
                <div class="input-container">
                    <label for="passwordInput">Password</label>
                    <input type="password" id="passwordInput" placeholder="••••••••">
                </div>
                <div class="input-container">
                    <label for="backendUrlInput">Backend URL</label>
                    <input type="text" id="backendUrlInput" placeholder="e.g. http://localhost:3000 (Optional)">
                </div>
            </div>
            <button id="authSubmitBtn" class="auth-submit-btn">Log In</button>
        </div>
    </div>

   
    <div class="container" id="mainContainer" style="display: none;">
        <header>
            <div class="header-main">
                <div class="logo-area">
                    <h1>DARSHON · Selfbot Panel</h1>
                    <p>Multi‑account | Voice | Messages</p>
                </div>
                
                
                <div id="navLinks" class="nav-links" style="display: none;">
                    <button id="viewSelfbotsBtn" class="nav-btn active">👤 My Accounts</button>
                    <button id="viewAdminBtn" class="nav-btn">👑 Admin Panel</button>
                </div>

                <div id="userHeader" class="user-header">
                    <span class="user-welcome">👋 Welcome, <strong id="loggedInUser"></strong></span>
                    <button id="logoutBtn" class="logout-btn">Logout</button>
                </div>
            </div>
        </header>

        
        <div id="selfbotsView" class="view-section">
            <div class="dashboard-grid">
                <div class="add-section">
                    <h2>➕ Add account</h2>
                    <div class="input-group">
                        <input type="text" id="tokenInput" placeholder="Discord token">
                        <button id="addBtn">Add</button>
                    </div>
                </div>

                <div class="accounts-section">
                    <h2>📋 My accounts</h2>
                    <div id="accountsList" class="accounts-grid">Loading...</div>
                </div>
            </div>
        </div>

      
        <div id="adminView" class="view-section" style="display: none;">
            <div class="admin-dashboard-grid">
                
                <div class="add-section">
                    <h2>👤 Create New User</h2>
                    <div class="admin-create-form">
                        <div class="input-container">
                            <label for="newUsername">Username</label>
                            <input type="text" id="newUsername" placeholder="Username">
                        </div>
                        <div class="input-container">
                            <label for="newPassword">Password</label>
                            <input type="password" id="newPassword" placeholder="Password (min 6 chars)">
                        </div>
                        <div class="input-container">
                            <label for="newLimit">Token Limit</label>
                            <input type="number" id="newLimit" placeholder="Limit" value="5" min="1">
                        </div>
                        <button id="createUserBtn" class="primary-btn">Create User</button>
                    </div>
                </div>

               
                <div class="accounts-section">
                    <h2>📋 Registered Users</h2>
                    <div class="table-container">
                        <table class="admin-table">
                            <thead>
                                <tr>
                                    <th>Username</th>
                                    <th>Role</th>
                                    <th>Selfbots Count</th>
                                    <th>Token Limit</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody id="userListBody">
                             
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
